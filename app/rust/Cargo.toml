[package]
name = "xr_bridge"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.13.0"
xr-client = { path = "../../core/xr-client" }
xr-proto = { path = "../../core/xr-proto" }
xr-sim = { path = "../../core/xr-sim" }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "time", "sync"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
