[package]
name = "xr-client"
version = "0.1.0"
description = "Cliente do XREAL One Pro: conexões, estado, trava de ajustes e registro."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
xr-proto = { path = "../xr-proto" }
xr-fusion = { path = "../xr-fusion" }
thiserror.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.3", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "test-util"] }
xr-sim = { path = "../xr-sim" }
